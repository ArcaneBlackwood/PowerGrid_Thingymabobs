plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
	archivesName = mod_id
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
	mavenLocal()
	maven { url = 'https://maven.neoforged.net/releases' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.createmod.net' }
	maven { url = 'https://maven.ithundxr.dev/snapshots' }
	maven { url = 'https://mvn.devos.one/snapshots' }
	maven { url = 'https://cursemaven.com' }


	maven { url = "https://maven.shedaniel.me" } // Cloth Config, REI
	maven { url = "https://maven.blamejared.com" } // JEI
	maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu, EMI
	maven { // Sable Companion
		name = "RyanHCode Maven"
		url = "https://maven.ryanhcode.dev/releases"
	}
}

neoForge {
	version = neoforge_version
	parchment {
		mappingsVersion = parchment_mappings_version
		minecraftVersion = minecraft_version
	}
	
	runs {
		client {
			client()
			//logLevel = org.slf4j.event.Level.DEBUG
			loggingConfigFile = file('log4j2.xml')
			
			//systemProperty 'mixin.debug.verbose', 'true'
			//systemProperty 'mixin.debug.export', 'true'
			//systemProperty 'mixin.dumpTargetOnFailure', 'true'
			//systemProperty 'mixin.env.disableRefMap', 'true'
			
			programArgument '--username'
			programArgument 'Dev'
			programArgument '--offlineDeveloperMode'
		}
		clientWorld {
			client()
			//logLevel = org.slf4j.event.Level.DEBUG
			loggingConfigFile = file('log4j2.xml')
			
			//systemProperty 'mixin.debug.verbose', 'true'
			//systemProperty 'mixin.debug.export', 'true'
			//systemProperty 'mixin.env.disableRefMap', 'true'
			
			programArgument '--username'
			programArgument 'Dev'
			programArgument '--quickPlaySingleplayer'
			programArgument 'New World'
			programArgument '--offlineDeveloperMode'
		}
		client2 {
			client()
			loggingConfigFile = file('log4j2.xml')
			programArgument '--username'
			programArgument 'DevTwo'
			programArgument '--offlineDeveloperMode'
		}
		server {
			server()
			//systemProperty 'mixin.debug.verbose', 'true'
			//systemProperty 'mixin.debug.export', 'true'
			//systemProperty 'mixin.dumpTargetOnFailure', 'true'
			loggingConfigFile = file('log4j2.xml')
			programArgument '--nogui'
		}
		data {
			data()
			programArguments.addAll '--all', '--mod', mod_id,
					'--output', file('src/generated/resources').absolutePath,
					'--existing', file('src/main/resources').absolutePath
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
	implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"
	implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
	implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
		transitive = false
	}
	implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
	compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
	runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
	implementation "com.tterrag.registrate:Registrate:${registrate_version}"

	// Put the exact released JAR in libs/ for the most reliable development setup.
	def localPowerGrid = file('libs/powergrid-mc1.21.1-0.6.0.1.jar')
	if (localPowerGrid.exists()) {
		implementation files(localPowerGrid)
	} else {
		implementation "curse.maven:power-grid-1321420:8648636"
	}


	compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
	runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
//	implementation "me.shedaniel:RoughlyEnoughItems-api-forge:$rei_version"
	implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") {
		version {
			prefer project.sable_companion_version
		}
	}
	compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
	runtimeOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
	runtimeOnly "curse.maven:aeronautics-676721:8763471"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
	def replaceProperties = [
			mod_version			 : mod_version,
			minecraft_version_range : minecraft_version_range,
			neoforge_version_range  : neoforge_version_range,
			sable_version		   : sable_version
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
}
